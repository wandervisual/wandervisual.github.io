<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WanderVisuals Configs</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- BACKGROUND -->
    <div class="background">
        <div class="stars"></div>
        <div class="moon"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="mountains"></div>
        <div class="horizon"></div>
        <div class="ground"></div>
    </div>


    <!-- HEADER -->
    <header class="header">
        <div class="container header-inner">

            <a href="/" class="logo">
                <img src="/wndr.png" alt="WanderVisuals">
                <span>WanderVisuals</span>
            </a>

            <nav class="nav">

                <a href="/" class="nav-link">
                    Главная
                </a>

                <a href="/#features" class="nav-link">
                    Возможности
                </a>

                <a href="/#download" class="nav-link">
                    Скачать
                </a>

                <a href="/configs/" class="nav-link config-button active">
                    <span>⚙</span> Configs
                </a>

            </nav>

        </div>
    </header>


    <!-- CONFIGS -->
    <main class="configs-page">

        <div class="container">

            <div class="configs-header">

                <div class="section-label">
                    CONFIGS
                </div>

                <h1>
                    WanderVisuals
                    <span>Configs</span>
                </h1>

            </div>


            <div class="coming-soon">

                <h2>
                    Пока что конфигов нет
                </h2>

                <p>
                    Конфиги появятся после релиза WanderVisuals.
                </p>

                <a href="/" class="button button-secondary back-button">
                    ← Вернуться на главную
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="container footer-inner">

            <div class="footer-brand">

                <img src="/wndr.png" alt="WanderVisuals">

                <span>
                    WanderVisuals
                </span>

            </div>

            <p>
                © 2026 WanderVisuals. All rights reserved.
            </p>

        </div>

    </footer>

</body>
</html>
